<!DOCTYPE html>
<html>
<head>
    <title>Генерация текста с TensorFlow.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
</head>
<body>
    <h1>Генерация текста</h1>
    <input type="text" id="seedText" value="люди" placeholder="Начальный текст">
    <button id="generate">Сгенерировать текст</button>
    <div id="output"></div>

    <script>
        let model;
        let tokenizer;
        let maxSequenceLen;
        let totalWords;

        // Загрузка модели и токенизатора
        async function loadAssets() {
            // Загружаем модель
            model = await tf.loadLayersModel('text_model/model.json');
            console.log('Модель загружена');

            // Загружаем токенизатор (в реальном проекте нужно загрузить сохраненный tokenizer.json)
            // Для примера создаем простой токенизатор
            tokenizer = {
                wordIndex: {
                    'на': 1, 'звезды': 2, 'люди': 3, 'интересовались': 4, 'многих': 5,
                    'лет': 6, 'они': 7, 'смотрели': 8, 'небо': 9, 'и': 10,
                    'задавались': 11, 'вопросами': 12, 'о': 13, 'вселенной': 14,
                    'наука': 15, 'астрономия': 16, 'помогает': 17, 'нам': 18,
                    'понять': 19, 'космос': 20
                },
                textsToSequences: function (texts) {
                    return texts.map(text =>
                        text.toLowerCase().split(' ')
                            .map(word => this.wordIndex[word])
                            .filter(idx => idx !== undefined)
                    );
                }
            };

            // Создаем обратный словарь
            tokenizer.indexWord = {};
            for (const [word, index] of Object.entries(tokenizer.wordIndex)) {
                tokenizer.indexWord[index] = word;
            }

            // Устанавливаем параметры (в реальном проекте загружайте из model_params.pkl)
            maxSequenceLen = 10;
            totalWords = 21;
        }

        // Генерация текста
        function generateText(seedText, nextWords = 20) {
            let output = seedText;

            for (let i = 0; i < nextWords; i++) {
                // Токенизация seed текста
                const tokenList = tokenizer.textsToSequences([seedText])[0];
                if (tokenList.length === 0) break;

                // Паддинг
                const padded = tf.pad(
                    tf.tensor1d(tokenList),
                    [[Math.max(maxSequenceLen - 1 - tokenList.length, 0), 0]]
                );

                // Обрезаем до max_sequence_len - 1
                const input = padded.slice([0], [maxSequenceLen - 1]);

                // Предсказание
                const predictions = model.predict(input.reshape([1, maxSequenceLen - 1]));
                const predictedId = tf.argMax(predictions, -1).dataSync()[0];

                // Добавляем новое слово
                const outputWord = tokenizer.indexWord[predictedId];
                if (!outputWord) break;

                seedText += " " + outputWord;
                output += " " + outputWord;
            }

            return output;
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadAssets();

                document.getElementById('generate').addEventListener('click', () => {
                    const seedText = document.getElementById('seedText').value;
                    const generated = generateText(seedText, 10);
                    document.getElementById('output').innerText = generated;
                });
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('output').innerText = 'Произошла ошибка: ' + error.message;
            }
        });
    </script>
</body>
</html>
